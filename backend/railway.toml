# Railway deployment — backend API (FastAPI)
#
# In the Railway service settings set:
#   Root Directory = backend
# so the build context contains requirements.txt and app/ (not a nested backend/).
#
# Then Railway builds backend/Dockerfile from that folder.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
