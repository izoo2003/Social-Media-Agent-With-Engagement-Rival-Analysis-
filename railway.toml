# Railway — use this when the service Root Directory is the repo root (empty).
# If Root Directory is set to `backend`, Railway will use backend/railway.toml instead.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
